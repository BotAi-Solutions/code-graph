packages:
  - "apps/*"
  - "packages/*"

# The sample repository under test-repositories/ is analysed as an *external*
# repo by the pipeline, so it is deliberately not a workspace package.

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1
